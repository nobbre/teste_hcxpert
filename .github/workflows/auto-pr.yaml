name: 🧪 Auto PR to Main with Cypress Tests

on:
    push:
        branches-ignore:
            - main

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: auto-pr-${{ github.ref }}
    cancel-in-progress: true

jobs:
    cypress-tests:
        runs-on: ubuntu-24.04

        steps:
            - name: 🚚 Checkout Code
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: 📦 Install Dependencies
              run: npm ci

            - name: 🧪 Run Cypress Tests
              uses: cypress-io/github-action@v6
              with:
                  browser: chrome
                  headed: false
                  spec: cypress/e2e/features/**/*.feature
              env:
                  CYPRESS_baseUrl: https://www.automationexercise.com

            - name: 📸 Upload Screenshots (on failure)
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-screenshots-${{ github.run_number }}
                  path: cypress/evidencias/**/*.png
                  if-no-files-found: ignore
                  retention-days: 30

            - name: 📹 Upload Videos
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-videos-${{ github.run_number }}
                  path: cypress/videos
                  if-no-files-found: ignore
                  retention-days: 7

            - name: 📊 Generate Test Report
              if: always()
              run: |
                  npm run report || echo "Report generation skipped"

            - name: 📄 Upload Test Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: cypress-reports-${{ github.run_number }}
                  path: |
                      reports/**/*
                      cypress/evidencias/**/*.html
                  if-no-files-found: ignore
                  retention-days: 30

    create-pr:
        runs-on: ubuntu-latest
        needs: cypress-tests

        steps:
            - name: 🚚 Checkout Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 🔍 Get Commit Info
              id: commit-info
              run: |
                  COMMIT_MSG=$(git log -1 --pretty=%B)
                  COMMIT_AUTHOR=$(git log -1 --pretty=%an)
                  echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
                  echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT

            - name: ✅ Create Pull Request
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  BRANCH="${{ github.ref_name }}"
                  COMMIT_MSG="${{ steps.commit-info.outputs.message }}"
                  COMMIT_AUTHOR="${{ steps.commit-info.outputs.author }}"

                  echo "🔍 Verificando se já existe PR da branch $BRANCH para main..."

                  if gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
                    echo "✓ PR já existe. Atualizando..."
                    PR_NUMBER=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
                    gh pr comment "$PR_NUMBER" --body "🔄 Testes executados novamente com sucesso! ✅"
                  else
                    echo "📝 Criando nova PR..."
                    BODY=$(cat <<EOF
                  ## ✅ Testes Cypress Aprovados

                  **Branch:** \`$BRANCH\`
                  **Último Commit:** $COMMIT_MSG
                  **Autor:** $COMMIT_AUTHOR

                  ### 🧪 Status dos Testes
                  - ✅ Todos os testes Cypress passaram
                  - 📊 Evidências e relatórios disponíveis nos artifacts
                  - 🔗 Run: [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  ---
                  *PR criada automaticamente pelo GitHub Actions*
                  EOF
                  )
                    gh pr create \
                      --base main \
                      --head "$BRANCH" \
                      --title "🚀 $BRANCH → main" \
                      --body "$BODY"
                    echo "✅ PR criada com sucesso!"
                  fi
